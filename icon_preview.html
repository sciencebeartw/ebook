<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Green PWA - SVG 圖示對照表</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            color: #065f46;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecfdf5;
            color: #0f766e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .icon-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        .icon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--primary);
        }

        .icon-preview {
            font-size: 2.5rem; /* SVG usually inherits font-size via 1em */
            margin-bottom: 15px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 50%;
            height: 60px;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .icon-name {
            font-weight: 600;
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .icon-label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* Demo cases */
        .demo-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .demo-label {
            min-width: 120px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .demo-content {
            flex-grow: 1;
        }

        .text-xl { font-size: 1.5rem; font-weight: bold; }
        .text-lg { font-size: 1.2rem; font-weight: 600; }
        .text-base { font-size: 1rem; }
        .text-sm { font-size: 0.85rem; }

        .makeup-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .tag-green { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .tag-yellow { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .tag-orange { background: #ffedd5; color: #9a3412; border: 1px solid #fdba74; }
        .tag-red { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .tag-warning { background: #fef3c7; color: #92400e; border: 2px dashed #fbbf24; }

        .sticker-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .status-approved { background: #dcfce7; color: #15803d; }
        .status-rejected { background: #fee2e2; color: #b91c1c; }
        .status-pending { background: #f3f4f6; color: #6b7280; }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SVG 圖示對照表</h1>
        <div class="subtitle">Bear Green PWA 全站視覺升級 - 圖示尺寸與對其測試</div>
    </header>

    <div class="section">
        <div class="section-title">核心功能圖示</div>
        <div class="icon-grid" id="main-icons"></div>
    </div>

    <div class="section">
        <div class="section-title">成績與狀態回饋</div>
        <div class="icon-grid" id="status-icons"></div>
    </div>

    <div class="section">
        <div class="section-title">實戰排版對照 (Test Cases)</div>
        
        <div class="demo-row">
            <div class="demo-label">大標題 (1.5rem)</div>
            <div class="demo-content text-xl" id="demo-h1"></div>
        </div>

        <div class="demo-row">
            <div class="demo-label">卡片首頁 (1.2rem)</div>
            <div class="demo-content text-lg" id="demo-h2"></div>
        </div>

        <div class="demo-row">
            <div class="demo-label">補考結果標籤</div>
            <div class="demo-content" id="demo-tags"></div>
        </div>

        <div class="demo-row">
            <div class="demo-label">棒卡審核狀態</div>
            <div class="demo-content" id="demo-status"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Bear Lab. All icons match surrounding text font-size via 1em scaling.
    </footer>
</div>

<script>
    const SVG = {
        calendar:  "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.15em;margin-right:5px'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>",
        megaphone: "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.15em;margin-right:5px'><path d='M22 2L11 13'/><path d='M22 2L15 22 11 13 2 9l20-7z'/></svg>",
        chat:      "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.15em;margin-right:5px'><path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/></svg>",
        star:      "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='#f59e0b' stroke='#f59e0b' stroke-width='1.5' style='vertical-align:-0.15em;margin-right:3px'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>",
        starLg:    "<svg width='1.2em' height='1.2em' viewBox='0 0 24 24' fill='#f59e0b' stroke='#f59e0b' stroke-width='1.5' style='vertical-align:-0.2em;margin-right:6px'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>",
        clip:      "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.15em;margin-right:4px'><path d='M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48'/></svg>",
        target:    "<svg width='1.3em' height='1.3em' viewBox='0 0 24 24' fill='none' stroke='#e11d48' stroke-width='2' stroke-linecap='round' style='vertical-align:-0.3em;margin-right:6px'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='6'/><circle cx='12' cy='12' r='2' fill='#e11d48'/></svg>",
        edit:      "<svg width='1.2em' height='1.2em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.25em;margin-right:6px'><path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>",
        check:     "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' style='vertical-align:-0.15em;margin-right:3px;border-radius:50%'><circle cx='12' cy='12' r='12' fill='#10b981'/><polyline points='6 12 10 16 18 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>",
        cross:     "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' style='vertical-align:-0.15em;margin-right:3px;border-radius:50%'><circle cx='12' cy='12' r='12' fill='#ef4444'/><line x1='7' y1='7' x2='17' y2='17' stroke='white' stroke-width='2.5' stroke-linecap='round'/><line x1='7' y1='17' x2='17' y2='7' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>",
        hourglass: "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='#f59e0b' stroke-width='2.5' stroke-linecap='round' style='vertical-align:-0.15em;margin-right:3px'><path d='M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 1 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2'/></svg>",
        lock:      "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:6px'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>",
        upload:    "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.15em;margin-right:5px'><polyline points='16 16 12 12 8 16'/><line x1='12' y1='12' x2='12' y2='21'/><path d='M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3'/></svg>",
        plus:      "<svg width='0.9em' height='0.9em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' style='vertical-align:-0.1em;margin-right:4px'><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>",
        alert:     "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:4px'><path d='M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/><line x1='12' y1='9' x2='12' y2='13'/><line x1='12' y1='17' x2='12.01' y2='17'/></svg>",
        smile:     "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:4px'><circle cx='12' cy='12' r='10'/><path d='M8 14s1.5 2 4 2 4-2 4-2'/><line x1='9' y1='9' x2='9.01' y2='9'/><line x1='15' y1='9' x2='15.01' y2='9'/></svg>",
        meh:       "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:4px'><circle cx='12' cy='12' r='10'/><line x1='8' y1='15' x2='16' y2='15'/><line x1='9' y1='9' x2='9.01' y2='9'/><line x1='15' y1='9' x2='15.01' y2='9'/></svg>",
        frown:     "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:4px'><circle cx='12' cy='12' r='10'/><path d='M16 16s-1.5-2-4-2-4 2-4 2'/><line x1='9' y1='9' x2='9.01' y2='9'/><line x1='15' y1='9' x2='15.01' y2='9'/></svg>",
        thumbsUp:  "<svg width='1.1em' height='1.1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.2em;margin-right:4px'><path d='M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3'/></svg>",
        medal:     "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='#d97706' stroke-width='2.5' stroke-linecap='round' style='vertical-align:-0.15em;margin-right:4px'><circle cx='12' cy='15' r='7'/><polyline points='8.21 13.89 7 23 12 20 17 23 15.79 13.88'/><path d='M8 12V7a4 4 0 0 1 8 0v5'/></svg>",
    };

    const mainList = ['calendar', 'megaphone', 'chat', 'starLg', 'star', 'clip', 'lock', 'upload', 'plus', 'medal'];
    const statusList = ['target', 'edit', 'thumbsUp', 'smile', 'meh', 'frown', 'alert', 'check', 'cross', 'hourglass'];

    function createCards(list, containerId) {
        const container = document.getElementById(containerId);
        list.forEach(key => {
            const card = document.createElement('div');
            card.className = 'icon-card';
            card.innerHTML = `
                <div class="icon-preview">${SVG[key]}</div>
                <div class="icon-name">SVG.${key}</div>
                <div class="icon-label">系統圖示名稱</div>
            `;
            container.appendChild(card);
        });
    }

    createCards(mainList, 'main-icons');
    createCards(statusList, 'status-icons');

    // Demos
    document.getElementById('demo-h1').innerHTML = SVG.calendar + " 2026/04/14 能量補給站 - 聯絡簿";
    document.getElementById('demo-h2').innerHTML = SVG.megaphone + " 今日聯絡事項與課程進度";
    
    document.getElementById('demo-tags').innerHTML = `
        <div class="makeup-tag tag-green">${SVG.thumbsUp} 補考結果：良好</div>
        <div class="makeup-tag tag-yellow">${SVG.smile} 補考結果：大致理解</div>
        <div class="makeup-tag tag-orange">${SVG.meh} 補考結果：不太理解</div>
        <div class="makeup-tag tag-red">${SVG.frown} 補考結果：必須加強</div>
        <div class="makeup-tag tag-warning">${SVG.alert} 未達標需補考</div>
    `;

    document.getElementById('demo-status').innerHTML = `
        <div class="sticker-status status-approved">${SVG.check} 通過</div>
        <div class="sticker-status status-rejected">${SVG.cross} 退回</div>
        <div class="sticker-status status-pending">${SVG.hourglass} 待審核</div>
    `;
</script>

</body>
</html>
