<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="LOGO.png" type="image/png">
  <meta name="theme-color" content="#edf5ef">
  <meta name="referrer" content="no-referrer"><title>段考／作業回報｜山熊科學</title>
  <link rel="stylesheet" href="report_portal.css?v=20260922_yan">
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="report_portal.js?v=20260922_yan"></script>
</head>
<body><main class="rp-shell">
  <header class="rp-cover">
    <img class="rp-logo" src="LOGO.png" alt="山熊科學 Bear’s Lab" width="1326" height="1512" fetchpriority="high">
    <div class="rp-brand">阿喵老師的學習專區</div>
    <h1>段考／作業回報</h1>
    <p>複習資料、答案與成績回報，都在這裡。</p>
  </header>
  <p id="rp-message" role="status" aria-live="polite"></p>
  <form id="rp-login" class="rp-card">
    <h2>進入我的專區</h2>
    <label>授課老師<select name="teacher"><option value="miaw">阿喵老師</option><option value="yan">小彥老師</option></select></label>
    <label>學生姓名<input name="name" placeholder="請輸入學生姓名" autocomplete="username" maxlength="80" required></label>
    <label>家長電話<input name="phone" placeholder="請輸入家長電話" type="password" inputmode="tel" autocomplete="current-password" maxlength="30" required></label>
    <label class="rp-check"><input name="remember" type="checkbox" checked>在此裝置保持登入</label>
    <button type="submit">登入專區</button>
    <p class="rp-muted rp-login-note">請使用成績表登記的家長電話。<br>若無法登入，請洽老師。</p>
  </form>
  <section id="rp-content" hidden>
    <div class="rp-toolbar"><strong id="rp-name"></strong><div><button id="rp-refresh" class="rp-secondary">重新整理</button><button id="rp-logout" class="rp-secondary">登出</button></div></div>
    <div id="rp-papers"></div>
  </section>
</main></body></html>
