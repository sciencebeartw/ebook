<main id="student" hidden><p class="eyebrow">電子聯絡簿 / 課本作業</p><h1>本週課本作業</h1><p class="lead">提交後會自動登記作業成績，不必另外傳訊息回報。</p><aside class="homework-reminder" aria-label="作業提醒"><strong>作業完成三步驟</strong><ol><li>先在紙本課本上完成作答，再上網填寫答案。</li><li>送出後查看分數與每題結果，用<strong>紅筆逐題訂正在課本上</strong>。</li><li>未訂正視同作業未完成；成績會自動登記，不必另行回報。</li></ol></aside><section id="login"><p>正在讀取作業…</p></section><div id="workspace" hidden><section><div class="section-heading"><h2 id="studentTitle"></h2><span id="studentName" class="tag"></span></div><p id="assignmentInfo"></p><div id="summary" role="status" aria-live="polite" aria-atomic="true"></div><div class="grade-status-row"><p id="gradeRefreshStatus" role="status"></p><button id="refreshSummary" class="quiet-button" type="button" hidden>重新確認成績</button></div><p id="studentStatus" role="status"></p></section><section id="conflict" hidden><h2>答案版本需要確認</h2><p>本機答案已保留，請選擇要使用的版本。</p><div id="comparison"></div><div class="actions"><button id="useServer">使用已保存版本</button><button id="keepLocal">保留本機答案</button></div></section><section id="answerSection"><div class="section-heading"><h2>本次作答</h2><span id="count"></span></div><div class="question-nav"><button id="previous">上一題</button><label>章內題號<select id="question"></select></label><button id="next">下一題</button></div><div id="questionCard" class="student-question"></div><div id="answerGrid"></div></section><section><h2>確認後提交</h2><label class="check"><input type="checkbox" id="blanks">確認未答題以留白送出</label><div class="actions"><button id="save">儲存草稿</button><button id="submit" class="primary">提交本週作業</button><button id="retry" hidden>重試原本的送出</button></div><p id="receipt" role="status"></p><div id="result"></div></section><section id="correctionRequest" hidden></section></div></main><p id="error" role="alert"></p>
