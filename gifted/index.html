<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>資優自然｜作業與自動登分驗收</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="student-media.css"></head><body data-gifted-production="true">

<header><div class="brand">山熊科學 <span>資優自然</span></div></header>
<main id="student" hidden><p class="eyebrow">電子聯絡簿 / 課本作業</p><h1>完成紙本，再上傳答案</h1><p class="lead">提交後會自動登記作業成績，不必另外傳訊息回報。</p><section id="login"><p>正在讀取作業…</p></section><div id="workspace" hidden><section><div class="section-heading"><h2 id="studentTitle"></h2><span id="studentName" class="tag"></span></div><p id="assignmentInfo"></p><div id="summary"></div><button id="refreshSummary" type="button">更新登記狀態</button><p id="studentStatus" role="status"></p></section><section id="conflict" hidden><h2>答案版本需要確認</h2><p>本機答案已保留，請選擇要使用的版本。</p><div id="comparison"></div><div class="actions"><button id="useServer">使用已保存版本</button><button id="keepLocal">保留本機答案</button></div></section><section id="answerSection"><div class="section-heading"><h2>本次作答</h2><span id="count"></span></div><div class="question-nav"><button id="previous">上一題</button><label>章內題號<select id="question"></select></label><button id="next">下一題</button></div><div id="questionCard" class="student-question"></div><div id="answerGrid"></div></section><section><h2>確認後提交</h2><label class="check"><input type="checkbox" id="blanks">確認未答題以留白送出</label><div class="actions"><button id="save">儲存草稿</button><button id="submit" class="primary">提交本週作業</button><button id="retry" hidden>重試原本的送出</button></div><p id="receipt" role="status"></p><div id="result"></div></section></div></main><p id="error" role="alert"></p>
<script src="student-media.js"></script><script src="answer-outbox.js"></script><script src="media-refresh.js"></script><script src="transport.js"></script><script src="app.js"></script></body></html>
